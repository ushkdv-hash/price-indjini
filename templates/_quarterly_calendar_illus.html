{# Схематичные иллюстрации квартальных календарей (макет reference-layout-draft) #}
{% macro quarterly_calendar_preview() %}
<div id="quarterly-preview" class="quarterly-preview" aria-live="polite">
  <!-- quarterly-illus-v5 -->
  <h2 class="quarterly-preview-title">Вид календаря</h2>
  <div class="quarterly-preview-frame">

    <figure class="quarterly-illus hidden" data-preview="tri_no_ad">
      <figcaption class="quarterly-illus-caption">Три блока · без рекламного поля</figcaption>
      <svg class="quarterly-illus-svg" viewBox="0 0 200 268" aria-hidden="true">
        <g transform="translate(25,10)">
          <rect width="150" height="68" rx="2" fill="currentColor" fill-opacity="0.22"/>
          <line x1="8" y1="70" x2="142" y2="70" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          <line x1="8" y1="125" x2="142" y2="125" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          <line x1="8" y1="180" x2="142" y2="180" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          {% for by in [73, 128, 183] %}
          <rect y="{{ by }}" width="150" height="50" rx="2" fill="var(--card)" stroke="currentColor" stroke-opacity="0.35" stroke-width="0.8"/>
          <g transform="translate(0,{{ by }})">
            <g fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.15" stroke-width="0.4">
              {% for r in range(4) %}{% for c in range(7) %}<rect x="{{ 8+c*13 }}" y="{{ 6+r*11 }}" width="11" height="7" rx="0.6"/>{% endfor %}{% endfor %}
            </g>
            <rect x="122" y="8" width="18" height="12" rx="1" fill="var(--card)" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.4"/>
            <rect x="122" y="24" width="18" height="12" rx="1" fill="var(--card)" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.4"/>
          </g>
          {% endfor %}
        </g>
      </svg>
    </figure>

    <figure class="quarterly-illus hidden" data-preview="tri_with_ad">
      <figcaption class="quarterly-illus-caption">Три блока · с рекламным блоком</figcaption>
      <svg class="quarterly-illus-svg" viewBox="0 0 200 322" aria-hidden="true">
        <g transform="translate(20,8)">
          <rect x="-4" y="-4" width="158" height="302" rx="3" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.8"/>
          <rect width="150" height="68" rx="2" fill="currentColor" fill-opacity="0.22"/>
          <line x1="8" y1="70" x2="142" y2="70" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          <line x1="8" y1="125" x2="142" y2="125" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          <line x1="8" y1="180" x2="142" y2="180" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          {% for by, ay in [(73, 123), (146, 196), (219, 269)] %}
          <rect y="{{ by }}" width="150" height="50" rx="2" fill="var(--card)" stroke="currentColor" stroke-opacity="0.35" stroke-width="0.8"/>
          <g transform="translate(0,{{ by }})">
            <g fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.15" stroke-width="0.4">
              {% for r in range(4) %}{% for c in range(7) %}<rect x="{{ 8+c*13 }}" y="{{ 6+r*11 }}" width="11" height="7" rx="0.6"/>{% endfor %}{% endfor %}
            </g>
            <rect x="122" y="8" width="18" height="12" rx="1" fill="var(--card)" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.4"/>
            <rect x="122" y="24" width="18" height="12" rx="1" fill="var(--card)" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.4"/>
          </g>
          <rect y="{{ ay }}" width="150" height="26" rx="2" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.35" stroke-width="0.6"/>
          <foreignObject x="0" y="{{ ay }}" width="150" height="26">
            <div xmlns="http://www.w3.org/1999/xhtml" class="qc-ad-label-box">рекламное поле</div>
          </foreignObject>
          {% endfor %}
        </g>
      </svg>
    </figure>

    <figure class="quarterly-illus hidden" data-preview="tri_individual">
      <figcaption class="quarterly-illus-caption">Три блока · индивидуальный блок</figcaption>
      <svg class="quarterly-illus-svg" viewBox="0 0 200 322" aria-hidden="true">
        <g transform="translate(20,8)">
          <rect x="-4" y="-4" width="158" height="302" rx="3" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.8"/>
          <rect width="150" height="68" rx="2" fill="currentColor" fill-opacity="0.22"/>
          <line x1="8" y1="70" x2="142" y2="70" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          <line x1="8" y1="125" x2="142" y2="125" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          <line x1="8" y1="180" x2="142" y2="180" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          {% for by, ay in [(73, 123), (146, 196), (219, 269)] %}
          <rect y="{{ by }}" width="150" height="50" rx="2" fill="var(--card)" stroke="var(--accent)" stroke-opacity="0.65" stroke-width="0.9" stroke-dasharray="3,2"/>
          <g transform="translate(0,{{ by }})">
            <rect x="11" y="7" width="14" height="14" rx="1" fill="var(--accent)" fill-opacity="0.55"/>
            <g fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-opacity="0.35" stroke-width="0.4">
              {% for r in range(4) %}{% for c in range(4) %}<rect x="{{ 30+c*12 }}" y="{{ 8+r*10 }}" width="10" height="6" rx="0.5"{% if r == 1 and c == 2 %} fill-opacity="0.35"{% endif %}/>{% endfor %}{% endfor %}
            </g>
            <rect x="88" y="6" width="54" height="38" rx="2" fill="currentColor" fill-opacity="0.1"/>
            <path d="M94 36 L108 18 L122 28 L138 14" stroke="currentColor" stroke-opacity="0.35" stroke-width="1" fill="none"/>
            <rect x="124" y="12" width="7" height="7" rx="1" fill="var(--accent-2)" fill-opacity="0.7"/>
          </g>
          <rect y="{{ ay }}" width="150" height="26" rx="2" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.35" stroke-width="0.6"/>
          <foreignObject x="0" y="{{ ay }}" width="150" height="26">
            <div xmlns="http://www.w3.org/1999/xhtml" class="qc-ad-label-box">рекламное поле</div>
          </foreignObject>
          {% endfor %}
        </g>
      </svg>
    </figure>

    <figure class="quarterly-illus hidden" data-preview="uno_no_ad">
      <figcaption class="quarterly-illus-caption">Уно · без рекламного поля</figcaption>
      <svg class="quarterly-illus-svg" viewBox="0 0 200 278" aria-hidden="true">
        <g transform="translate(10,10)">
          <rect width="180" height="102" rx="2" fill="currentColor" fill-opacity="0.22"/>
          <line x1="10" y1="104" x2="170" y2="104" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          <rect y="107" width="180" height="130" rx="2" fill="var(--card)" stroke="currentColor" stroke-opacity="0.35" stroke-width="0.8"/>
          <g transform="translate(0,107)">
            <g fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.12" stroke-width="0.35">
              {% for r in range(5) %}{% for c in range(7) %}<rect x="{{ 10+c*20 }}" y="{{ 10+r*22 }}" width="16" height="16" rx="0.6"/>{% endfor %}{% endfor %}
            </g>
            <rect x="154" y="14" width="16" height="100" rx="1" fill="var(--card)" stroke="currentColor" stroke-opacity="0.15" stroke-width="0.4"/>
          </g>
        </g>
      </svg>
    </figure>

    <figure class="quarterly-illus hidden" data-preview="uno_with_ad">
      <figcaption class="quarterly-illus-caption">Уно · с рекламным блоком</figcaption>
      <svg class="quarterly-illus-svg" viewBox="0 0 200 288" aria-hidden="true">
        <g transform="translate(5,8)">
          <rect x="-4" y="-4" width="188" height="272" rx="3" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.8"/>
          <rect width="180" height="102" rx="2" fill="currentColor" fill-opacity="0.22"/>
          <line x1="10" y1="104" x2="170" y2="104" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          <rect y="107" width="180" height="130" rx="2" fill="var(--card)" stroke="currentColor" stroke-opacity="0.35" stroke-width="0.8"/>
          <g transform="translate(0,107)">
            <g fill="currentColor" fill-opacity="0.08" stroke="currentColor" stroke-opacity="0.12" stroke-width="0.35">
              {% for r in range(5) %}{% for c in range(7) %}<rect x="{{ 10+c*20 }}" y="{{ 10+r*22 }}" width="16" height="16" rx="0.6"/>{% endfor %}{% endfor %}
            </g>
            <rect x="154" y="14" width="16" height="100" rx="1" fill="var(--card)" stroke="currentColor" stroke-opacity="0.15" stroke-width="0.4"/>
          </g>
          <rect y="237" width="180" height="30" rx="2" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.35" stroke-width="0.6"/>
          <foreignObject x="0" y="237" width="180" height="30">
            <div xmlns="http://www.w3.org/1999/xhtml" class="qc-ad-label-box">рекламное поле</div>
          </foreignObject>
        </g>
      </svg>
    </figure>

    <figure class="quarterly-illus hidden" data-preview="uno_individual">
      <figcaption class="quarterly-illus-caption">Уно · индивидуальный блок</figcaption>
      <svg class="quarterly-illus-svg" viewBox="0 0 200 288" aria-hidden="true">
        <g transform="translate(5,8)">
          <rect x="-4" y="-4" width="188" height="272" rx="3" fill="currentColor" fill-opacity="0.05" stroke="currentColor" stroke-opacity="0.2" stroke-width="0.8"/>
          <rect width="180" height="102" rx="2" fill="currentColor" fill-opacity="0.22"/>
          <line x1="10" y1="104" x2="170" y2="104" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2,2"/>
          <rect y="107" width="180" height="130" rx="2" fill="var(--card)" stroke="var(--accent)" stroke-opacity="0.65" stroke-width="0.9" stroke-dasharray="3,2"/>
          <g transform="translate(0,107)">
            <rect width="180" height="22" rx="2" fill="var(--accent)" fill-opacity="0.28"/>
            {% for i in range(5) %}<rect x="{{ 38+i*22 }}" y="7" width="12" height="8" rx="1" fill="currentColor" fill-opacity="0.45"/>{% endfor %}
            <rect x="13" y="29" width="18" height="18" rx="1" fill="var(--accent)" fill-opacity="0.55"/>
            <g fill="var(--accent)" fill-opacity="0.18" stroke="var(--accent)" stroke-opacity="0.35" stroke-width="0.4">
              {% for r in range(4) %}{% for c in range(4) %}<rect x="{{ 38+c*14 }}" y="{{ 30+r*22 }}" width="12" height="16" rx="0.5"{% if r == 1 and c == 1 %} fill-opacity="0.35"{% endif %}/>{% endfor %}{% endfor %}
            </g>
            <rect x="112" y="28" width="62" height="88" rx="2" fill="currentColor" fill-opacity="0.1"/>
            <path d="M118 100 L135 52 L152 72 L168 40" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2" fill="none"/>
          </g>
          <rect y="237" width="180" height="30" rx="2" fill="currentColor" fill-opacity="0.04" stroke="currentColor" stroke-opacity="0.35" stroke-width="0.6"/>
          <foreignObject x="0" y="237" width="180" height="30">
            <div xmlns="http://www.w3.org/1999/xhtml" class="qc-ad-label-box">рекламное поле</div>
          </foreignObject>
        </g>
      </svg>
    </figure>

  </div>
</div>
{% endmacro %}

{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">▣</div>
    <h1>Вход в систему</h1>
    <p class="muted">Калькулятор стоимости продукции</p>
    <form method="post" class="auth-form">
      <label>Логин
        <input type="text" name="username" autofocus required>
      </label>
      <label>Пароль
        <input type="password" name="password" required>
      </label>
      <button type="submit" class="btn-primary">Войти</button>
    </form>
    <p class="muted center">Нет аккаунта? <a href="{{ url_for('register') }}">Зарегистрироваться</a></p>
    <p class="muted center"><a href="{{ url_for('reset_password') }}">Забыли пароль?</a></p>
  </div>
</div>
{% endblock %}

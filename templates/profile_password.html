{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">▣</div>
    <h1>Смена пароля</h1>
    <p class="muted small">Пользователь: {{ user.username }}</p>
    <form method="post" class="auth-form">
      <label>Текущий пароль
        <input type="password" name="current_password" required autofocus>
      </label>
      <label>Новый пароль
        <input type="password" name="new_password" minlength="4" required>
      </label>
      <label>Повторите новый пароль
        <input type="password" name="new_password2" minlength="4" required>
      </label>
      <button type="submit" class="btn-primary">Сохранить пароль</button>
    </form>
    <p class="muted center"><a href="{{ url_for('calculator') }}">← Вернуться к калькулятору</a></p>
  </div>
</div>
{% endblock %}

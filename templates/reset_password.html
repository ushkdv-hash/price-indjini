{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">▣</div>
    <h1>Восстановление пароля</h1>
    <p class="muted small">Введите логин и одноразовый код восстановления, который выдал администратор (актуально 24 часа).</p>
    <form method="post" class="auth-form">
      <label>Логин
        <input type="text" name="username" value="{{ request.form.get('username', '') }}" required autofocus>
      </label>
      <label>Код восстановления
        <input type="text" name="token" value="{{ request.args.get('token', '') }}" required>
      </label>
      <label>Новый пароль
        <input type="password" name="password" minlength="4" required>
      </label>
      <label>Повторите новый пароль
        <input type="password" name="password2" minlength="4" required>
      </label>
      <button type="submit" class="btn-primary">Восстановить пароль</button>
    </form>
    <p class="muted center">Вспомнили пароль? <a href="{{ url_for('login') }}">Войти</a></p>
  </div>
</div>
{% endblock %}
